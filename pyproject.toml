[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysdesignhelper"
version = "0.1.0"
description = "Desktop trainer for system design interviews, with every claim cited to a primary source"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.7", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
sysdesignhelper = "sysdesignhelper.app:main"

[tool.setuptools.packages.find]
include = ["sysdesignhelper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
