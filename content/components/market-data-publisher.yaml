id: market-data-publisher
name: Market data publisher
mechanisms: [sequenced-multicast, price-time-priority]
sections:
  - heading: A separate, outbound-only feed
    claims:
      - text: >
          Nasdaq's order entry protocol only lets participants send orders and receive updates on
          their own orders; information about all orders entered into and executed on the book
          comes from the separate ITCH protocol.
        cite: [ouch]
      - text: >
          TotalView-ITCH is an outbound market data feed only. It provides full order depth,
          using a series of messages to track the life of an order.
        cite: [itch]
  - heading: What is published
    claims:
      - text: >
          An Add Order message indicates that a new order has been accepted and added to the
          displayable book, and includes a day-unique Order Reference Number.
        cite: [itch]
      - text: >
          An Order Executed message is sent whenever an order on the book is executed in whole or
          in part, and an Order Delete message whenever an order on the book is cancelled.
        cite: [itch]
      - text: >
          Subscribers work out an order's current displayed shares by deducting the shares stated
          in each modify message from the shares in the Add Order with the same reference
          number.
        cite: [itch]
      - text: Timestamps are represented as nanoseconds since midnight.
        cite: [itch]
  - heading: Transport
    claims:
      - text: >
          Nasdaq offers the feed over SoupBinTCP and over MoldUDP64, a UDP multicast protocol in
          which each packet is transmitted once regardless of the number of listeners.
        cite: [itch, moldudp64]
      - text: >
          Coinbase's exchange multicasts the trading system's output to its order and market data
          gateways, and serves market data to clients over FIX and WebSocket.
        cite: [coinbase-exchange]
recall:
  - prompt: Why can a participant not learn the state of the whole book from its order entry session?
    answer:
      - text: >
          Order entry only reports on the participant's own orders; all orders on the book are
          published on the separate ITCH feed.
        cite: [ouch]
  - prompt: Which three ITCH messages let a subscriber follow an order from arrival to removal?
    answer:
      - text: >
          Add Order when it joins the book, Order Executed when it trades in whole or part, and
          Order Delete when it is cancelled.
        cite: [itch]
  - prompt: How does a subscriber compute an order's remaining displayed shares?
    answer:
      - text: >
          By deducting the shares in each modify message from the shares in the Add Order with
          the same reference number.
        cite: [itch]
