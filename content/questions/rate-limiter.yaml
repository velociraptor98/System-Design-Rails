id: rate-limiter
title: Design a rate limiter
category: general
prompt: >
  Design a rate limiter for a public API served by many instances: each user may make a limited
  number of requests in a period, and requests over the limit are rejected.

scope:
  functional:
    - Limit each user to a set number of requests per period.
    - Reject a request over the limit with a response that tells the client it was rate limited.
    - Allow a short burst above the steady rate.
    - Apply the same limit whichever service instance receives the request.
  non_functional:
    - The check adds very little latency to each request.
    - If the limiter's own storage fails, requests are still served.
    - The count is accurate enough that the limit means what it says.
  assumptions:
    - 10,000 requests per second across all users at peak.
    - 1 million users active in any one period.
    - The limit is 100 requests per minute per user.
    - A counter record is a 32-byte key and two 8-byte numbers.
  estimates:
    - label: Counter updates per second
      working: one update per request
      result: 10,000 per second
    - label: Memory for the counters
      working: 1,000,000 x (32 + 8 + 8) bytes
      result: 48 MB
    - label: Records if every request were logged instead, for one minute
      working: 10,000 x 60
      result: 600,000 timestamps held at any moment

api:
  kind: real-system
  system: HTTP (RFC 6585) and Stripe's API
  key_points:
    - text: >
        The 429 (Too Many Requests) status code indicates that the user has sent too many
        requests in a given amount of time.
      cite: [rfc6585]
    - text: >
        The response SHOULD include details explaining the condition and MAY include a
        Retry-After header indicating how long to wait before making a new request.
      cite: [rfc6585]
    - text: A response with the 429 status code MUST NOT be stored by a cache.
      cite: [rfc6585]
    - text: >
        The specification does not define how the server identifies the user or counts requests:
        it may count per resource, across the server or across a set of servers, and identify the
        user by credentials or a cookie.
      cite: [rfc6585]
    - text: >
        Stripe chooses between 429 and 503 (Service Unavailable) depending on the situation; its
        fleet usage load shedder rejects with 503.
      cite: [stripe-rate-limiters]

data_model:
  kind: real-system
  system: Cloudflare and Stripe
  key_points:
    - text: >
        Cloudflare stores only two numbers per counter, the counts for the previous and current
        periods, and estimates the rate over the sliding window from them.
      cite: [cloudflare-counting]
    - text: >
        With 42 requests in the previous minute and 18 in the current minute, 15 seconds old,
        the estimate is 42 x ((60 - 15) / 60) + 18 = 49.5 requests.
      cite: [cloudflare-counting]
    - text: >
        The counters are updated with INCR, an atomic increment, on a store that offers only GET,
        SET and INCR.
      cite: [cloudflare-counting]
    - text: >
        Stripe instead keeps a token bucket per user: each request takes a token, tokens drip
        back over time, and an empty bucket means the request is rejected.
      cite: [stripe-rate-limiters]

architecture:
  kind: synthesized
  notes:
    - text: >
        Every request passes through the rate limiter before it reaches the service. The limiter
        keeps its counters in a shared in-memory store so that all its instances see the same
        counts.
      synthesis: true
    - text: Stripe implements its rate limiters using Redis.
      cite: [stripe-rate-limiters]
    - text: >
        Stripe advises that if the rate limiting code has bugs or Redis goes down, requests
        should not be affected.
      cite: [stripe-rate-limiters]
    - text: >
        Cloudflare keeps an isolated counting system inside each point of presence instead of
        reporting counters to one central point.
      cite: [cloudflare-counting]
  design:
    blocks:
      - {id: client, component: client, name: API client, x: 0, y: 0}
      - {id: limiter, component: rate-limiter, name: Rate limiter, instances: 4, x: 300, y: 0,
         extras: {algorithm: token-bucket}}
      - {id: svc, component: service, name: API service, instances: 8, x: 700, y: 0}
      - {id: counters, component: in-memory-store, name: Counters, technology: Redis, x: 300, y: 190}
    connections:
      - {from: client, to: limiter, mode: sync, protocol: HTTP, path: both}
      - {from: limiter, to: svc, mode: sync, protocol: HTTP, path: both, label: allowed requests}
      - {from: limiter, to: counters, mode: sync, protocol: TCP, path: both, label: take token}
  checks:
    - id: limiter-in-front
      title: Requests reach the Service only through a Rate limiter
      miss: A Client connects straight to a Service, or no Rate limiter feeds a Service.
      rule:
        all_of:
          - has_connection: {from: {component: rate-limiter}, to: {component: service}}
          - no_connection: {from: {component: client}, to: {component: service}}
      rationale:
        text: >
          A rate limiter is used to control the rate of traffic sent or received on the network.
        cite: [stripe-rate-limiters]
    - id: counters-shared
      title: The Rate limiter keeps its counters in an In-memory store
      miss: No Connection leads from a Rate limiter to an In-memory store.
      rule:
        has_connection: {from: {component: rate-limiter}, to: {component: in-memory-store}}
      rationale:
        text: >
          Stripe implements its rate limiters using Redis, and Cloudflare keeps its counters in a
          store reached over the memcached protocol.
        cite: [stripe-rate-limiters, cloudflare-counting]
    - id: algorithm-stated
      title: The Rate limiter uses an algorithm that does not reset at window boundaries
      miss: The Rate limiter's algorithm is not set, or is fixed-window.
      rule:
        each_block:
          where: {component: rate-limiter}
          require: {extras.algorithm: [token-bucket, sliding-window]}
      rationale:
        text: >
          A counter that is reset at the start of each period allows regular traffic spikes to go
          through the rate limiter.
        cite: [cloudflare-counting]

deep_dives:
  - prompt: A counter that resets each minute lets a client send a double burst across the boundary. How do you count more accurately without storing every request?
    kind: real-system
    system: Cloudflare
    pages: [sliding-window-counter]
    key_points:
      - text: >
          Resetting a counter at the start of each period allows regular traffic spikes through.
        cite: [cloudflare-counting]
      - text: >
          Keeping a record per request is more accurate but has huge processing and memory
          requirements.
        cite: [cloudflare-counting]
      - text: >
          Cloudflare keeps two numbers per counter and weights the previous period's count by the
          share of it still inside the window, as in 42 x 0.75 + 18 = 49.5.
        cite: [cloudflare-counting]
      - text: >
          It measured 0.003% of requests wrongly allowed or rate limited and an average 6%
          difference between the real and approximate rates.
        cite: [cloudflare-counting]
  - prompt: The store holding the counters becomes unreachable. What happens to API traffic, and how do you avoid finding out in production?
    kind: real-system
    system: Stripe
    pages: [rate-limiter]
    key_points:
      - text: >
          Stripe's advice is to make sure that if Redis goes down, or the rate limiting code has
          bugs, requests are not affected.
        cite: [stripe-rate-limiters]
      - text: >
          Stripe dark launches each rate limiter first, to watch the traffic it would block.
        cite: [stripe-rate-limiters]
      - text: >
          Rate limiting is not the only protection: Stripe's fleet usage load shedder always
          reserves a fraction of the infrastructure for critical requests.
        cite: [stripe-rate-limiters]
  - prompt: The API is served from many data centres. Where do the counters live?
    kind: real-system
    system: Cloudflare
    pages: [rate-limiter, in-memory-store]
    key_points:
      - text: >
          Cloudflare judged reporting all counters to a single central point not realistic.
        cite: [cloudflare-counting]
      - text: >
          With anycast routing the traffic from a single IP address always reaches the same
          point of presence, so each one can run an isolated counting system.
        cite: [cloudflare-counting]
      - text: >
          Increments run asynchronously so they do not slow down requests; only a small piece of
          information is checked while a request is processed.
        cite: [cloudflare-counting]
