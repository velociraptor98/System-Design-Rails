id: client
name: Client
sections:
  - heading: What it is
    claims:
      - text: >
          An HTTP client is a program that establishes a connection to a server for the purpose
          of sending one or more HTTP requests.
        cite: [rfc9110]
  - heading: Clients of an exchange
    claims:
      - text: >
          Coinbase's exchange engineers note that most users would not interact with an exchange
          directly: users reach it through a brokerage, while market makers and trading firms
          connect to the exchange itself.
        cite: [coinbase-exchange]
      - text: >
          Nasdaq describes its native order entry protocol as intended to let participants
          integrate Nasdaq into their proprietary trading systems or build custom front ends.
        cite: [ouch]
recall:
  - prompt: Who connects directly to an exchange, according to Coinbase's exchange team?
    answer:
      - text: >
          Market makers and trading firms. Most users go through a brokerage instead.
        cite: [coinbase-exchange]
