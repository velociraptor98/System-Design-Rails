id: consumer-offsets
name: Pull consumption and offsets
sections:
  - heading: Pull, not push
    claims:
      - text: >
          LinkedIn found the pull model more suitable than push because each consumer can
          retrieve messages at the maximum rate it can sustain and avoids being flooded by
          messages pushed faster than it can handle.
        cite: [kafka-paper]
      - text: The pull model also makes it easy to rewind a consumer.
        cite: [kafka-paper]
  - heading: Offsets
    claims:
      - text: >
          A consumer always consumes messages from a partition sequentially. Acknowledging an
          offset implies that the consumer has received all messages before that offset in the
          partition.
        cite: [kafka-paper]
      - text: >
          How much each consumer has consumed is maintained by the consumer, not the broker,
          which reduces the complexity and overhead on the broker.
        cite: [kafka-paper]
  - heading: Consumer groups
    claims:
      - text: >
          A consumer group is one or more consumers that jointly consume a set of topics: each
          message is delivered to only one consumer within the group.
        cite: [kafka-paper]
      - text: >
          Different consumer groups each independently consume the full set of messages, and no
          coordination is needed across groups.
        cite: [kafka-paper]
  - heading: Delivery guarantee
    claims:
      - text: >
          In general Kafka guarantees only at-least-once delivery. A message is usually delivered
          exactly once to each consumer group, but not when a consumer process crashes without a
          clean shutdown.
        cite: [kafka-paper]
recall:
  - prompt: Why did LinkedIn choose pull over push for consumers?
    answer:
      - text: >
          Each consumer retrieves messages at the maximum rate it can sustain and is not flooded,
          and a consumer is easy to rewind.
        cite: [kafka-paper]
  - prompt: What does acknowledging an offset mean?
    answer:
      - text: That the consumer has received all messages before that offset in the partition.
        cite: [kafka-paper]
  - prompt: What delivery guarantee does Kafka give, and when does it show?
    answer:
      - text: >
          At-least-once. Duplicates can appear when a consumer process crashes without a clean
          shutdown.
        cite: [kafka-paper]
  - prompt: How do two consumer groups reading the same topic affect each other?
    answer:
      - text: >
          They do not: each group independently consumes the full set of messages with no
          coordination across groups.
        cite: [kafka-paper]
