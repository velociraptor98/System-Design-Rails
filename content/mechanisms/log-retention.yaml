id: log-retention
name: Log segments and retention
sections:
  - heading: Storage layout
    claims:
      - text: >
          In Kafka each partition of a topic corresponds to a logical log, implemented as a set
          of segment files of approximately the same size, for example 1 GB.
        cite: [kafka-paper]
      - text: >
          When a producer publishes a message to a partition, the broker simply appends it to the
          last segment file.
        cite: [kafka-paper]
      - text: >
          Segment files are flushed to disk only after a configurable number of messages have
          been published or a certain amount of time has elapsed, and a message is exposed to
          consumers only after it is flushed.
        cite: [kafka-paper]
  - heading: Deleting by age
    claims:
      - text: >
          A Kafka broker does not record how much each consumer has consumed, so it cannot know
          whether all subscribers have read a message before deleting it.
        cite: [kafka-paper]
      - text: >
          Kafka solves this with a time-based retention policy: a message is automatically
          deleted once it has been retained longer than a set period, typically 7 days.
        cite: [kafka-paper]
      - text: >
          Long retention is feasible because Kafka's performance does not degrade as the data
          size grows.
        cite: [kafka-paper]
recall:
  - prompt: Why can a Kafka broker not delete a message once every consumer has read it?
    answer:
      - text: >
          The broker does not keep track of how much each consumer has consumed; the consumers
          do.
        cite: [kafka-paper]
  - prompt: What rule does Kafka use to delete messages instead?
    answer:
      - text: >
          Time-based retention: a message is deleted after it has been retained longer than a set
          period, typically 7 days.
        cite: [kafka-paper]
  - prompt: How is a Kafka partition laid out on disk?
    answer:
      - text: >
          As a set of segment files of roughly equal size, such as 1 GB; new messages are
          appended to the last one.
        cite: [kafka-paper]
