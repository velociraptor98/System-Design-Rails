id: sequenced-multicast
name: Sequenced multicast with gap recovery
sections:
  - heading: One transmitter, many listeners
    claims:
      - text: >
          Nasdaq's MoldUDP64 is a lightweight protocol layer on top of UDP for transmitting data
          messages from one transmitter to many listeners, with a mechanism for listeners to
          detect and re-request missed packets.
        cite: [moldudp64]
      - text: >
          Each outbound packet is transmitted only once regardless of the number of listeners,
          and multiple messages may be aggregated into one packet to reduce network traffic.
        cite: [moldudp64]
      - text: >
          The server transmits on a well-known multicast group for each data stream, and
          listeners subscribe to that group to receive it.
        cite: [moldudp64]
  - heading: Detecting loss
    claims:
      - text: >
          Each packet header carries the session, the sequence number of the first message in the
          packet, and a message count; later messages in the packet are implicitly numbered
          sequentially.
        cite: [moldudp64]
      - text: >
          Heartbeats, typically once per second, carry the next expected sequence number so that
          receivers can sense packet loss even when traffic is low.
        cite: [moldudp64]
  - heading: Recovering
    claims:
      - text: >
          A receiver that detects a sequence number gap sends a Request Packet to a re-request
          server, which replies over UDP unicast with the requested messages.
        cite: [moldudp64]
      - text: >
          Optional caching re-request servers can be placed near remote receivers to reduce
          latency and bandwidth over WAN links.
        cite: [moldudp64]
recall:
  - prompt: How does a MoldUDP64 listener notice it missed a packet during a quiet period?
    answer:
      - text: >
          Heartbeats, typically once per second, carry the next expected sequence number.
        cite: [moldudp64]
  - prompt: What does a listener do after detecting a sequence gap?
    answer:
      - text: >
          It sends a Request Packet to a re-request server, which replies by UDP unicast.
        cite: [moldudp64]
  - prompt: How does the cost of sending one packet change as listeners are added?
    answer:
      - text: >
          It does not: each outbound packet is transmitted only once regardless of the number of
          listeners.
        cite: [moldudp64]
