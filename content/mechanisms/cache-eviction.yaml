id: cache-eviction
name: Cache eviction
sections:
  - heading: When eviction happens
    claims:
      - text: >
          Because cache entries are copies of persistently stored data, it is usually safe to
          evict them when the cache runs out of memory; they can be cached again later.
        cite: [redis-eviction]
      - text: >
          In Redis, whenever a client runs a command that adds data, the server checks memory
          usage, and if it is above the configured limit it evicts keys according to the chosen
          policy until usage is back below the limit.
        cite: [redis-eviction]
  - heading: Policies
    claims:
      - text: >
          Under noeviction, keys are not evicted and the server returns an error for commands
          that would cache new data; commands that only read existing data still work.
        cite: [redis-eviction]
      - text: >
          allkeys-lru evicts the least recently used keys, allkeys-lfu the least frequently used,
          and allkeys-random evicts at random. The volatile variants consider only keys that have
          an expiration, and volatile-ttl evicts the keys with the shortest remaining TTL.
        cite: [redis-eviction]
      - text: >
          The Redis documentation recommends allkeys-lru when a subset of elements is accessed far
          more often than the rest, and calls it a good default.
        cite: [redis-eviction]
  - heading: Approximation
    claims:
      - text: >
          Redis does not compute exact LRU. It samples a small number of keys at random and
          evicts the ones with the longest time since last access, because a true LRU
          implementation costs more memory.
        cite: [redis-eviction]
      - text: >
          LFU is approximated too, using a probabilistic counter of a few bits per object combined
          with a decay period so the counter falls over time.
        cite: [redis-eviction]
recall:
  - prompt: What does Redis do under the noeviction policy once the memory limit is reached?
    answer:
      - text: >
          It evicts nothing and returns an error for commands that would add data; read-only
          commands still work.
        cite: [redis-eviction]
  - prompt: Does Redis implement exact LRU? Why or why not?
    answer:
      - text: >
          No. It samples a small number of keys and evicts those idle longest, because true LRU
          costs more memory.
        cite: [redis-eviction]
  - prompt: When does the Redis documentation recommend allkeys-lru?
    answer:
      - text: >
          When a subset of elements is accessed far more often than the rest; it is described as
          a good default.
        cite: [redis-eviction]
