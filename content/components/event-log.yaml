id: event-log
name: Event log
mechanisms: [log-retention, consumer-offsets, replicated-state-machine, write-ahead-log]
extras:
  - key: retention
    label: Retention
    options: [time-based, keep-forever]
sections:
  - heading: The log is the input
    claims:
      - text: >
          In Coinbase Derivatives Exchange the cluster persists the Raft log, which is the
          trading system's input, to disk as the protocol requires.
        cite: [coinbase-exchange]
      - text: >
          Coinbase replicates input, not output, because output is larger and unbounded: one
          order can produce a cascading set of events.
        cite: [coinbase-exchange]
  - heading: Replicating it off the cluster
    claims:
      - text: >
          The Aeron Archive API allows the Raft log to be replicated to a cluster backup.
        cite: [coinbase-exchange]
      - text: >
          Coinbase replicates the log in a binary tree so that network latency is bounded by
          log(n) and bandwidth use is bounded.
        cite: [coinbase-exchange]
  - heading: What a replayable log is used for
    claims:
      - text: >
          Coinbase uses the replicated log for audit by uploading it to cold storage, for logging
          by replaying it outside the hot path, for debugging by reproducing bugs locally, for
          backfilling missing events, and for replay in CI to avoid regressions.
        cite: [coinbase-exchange]
      - text: >
          Because the trading system is deterministic, an old snapshot plus the old input can be
          replayed to reach the live state.
        cite: [coinbase-exchange]
  - heading: A log that many consumers read
    claims:
      - text: >
          LinkedIn built Kafka because, in addition to offline analytics, it needed to support
          real-time applications that consume log data within seconds.
        cite: [kafka-paper]
      - text: >
          A Kafka broker appends each published message to the last segment file of a partition,
          and consumers pull messages sequentially, tracking their own position.
        cite: [kafka-paper]
      - text: >
          Messages are deleted by age: a message is removed once it has been retained longer than
          a set period, typically 7 days.
        cite: [kafka-paper]
      - text: >
          LinkedIn reports Kafka accumulating hundreds of gigabytes of data and close to a
          billion messages per day.
        cite: [kafka-paper]
recall:
  - prompt: Why does Coinbase replicate the trading system's input and not its output?
    answer:
      - text: >
          Output is larger and unbounded, since one order can cause a cascading set of events.
        cite: [coinbase-exchange]
  - prompt: Give three uses Coinbase makes of its replicated log outside the hot path.
    answer:
      - text: >
          Audit, logging, debugging, backfilling missing events, and CI replay testing are the
          five it lists.
        cite: [coinbase-exchange]
  - prompt: What property of the trading system makes replaying the log useful?
    answer:
      - text: >
          Determinism: an old snapshot plus the old input reproduces the live state.
        cite: [coinbase-exchange]
  - prompt: How does Kafka decide when to delete a message?
    answer:
      - text: >
          By age: it is deleted once retained longer than a set period, typically 7 days.
        cite: [kafka-paper]
