id: http-redirection
name: HTTP redirection
sections:
  - heading: Permanent redirects
    claims:
      - text: >
          301 (Moved Permanently) indicates that the target resource has been assigned a new
          permanent URI and that future references ought to use one of the enclosed URIs.
        cite: [rfc9110]
      - text: >
          A 301 response is heuristically cacheable unless the method definition or explicit
          cache controls say otherwise.
        cite: [rfc9110]
  - heading: Temporary redirects
    claims:
      - text: >
          302 (Found) indicates that the target resource resides temporarily under a different
          URI, and that the client ought to continue to use the target URI for future requests.
        cite: [rfc9110]
      - text: >
          The status codes defined as heuristically cacheable are 200, 203, 204, 206, 300, 301,
          308, 404, 405, 410, 414 and 501; all other status codes, 302 and 307 among them, are
          not heuristically cacheable.
        cite: [rfc9110]
  - heading: Location and request method
    claims:
      - text: >
          For both 301 and 302 the server SHOULD generate a Location header field containing the
          URI to redirect to, and the user agent MAY use it for automatic redirection.
        cite: [rfc9110]
      - text: >
          For historical reasons a user agent MAY change the request method from POST to GET
          after a 301 or 302. 308 and 307 are the permanent and temporary codes to use when that
          is undesired; with 307 the user agent MUST NOT change the method.
        cite: [rfc9110]
recall:
  - prompt: Which of 301 and 302 may a cache reuse without explicit cache headers?
    answer:
      - text: >
          301. It is heuristically cacheable; 302 is not in the list of heuristically cacheable
          status codes.
        cite: [rfc9110]
  - prompt: After a 302, which URI should the client use for future requests?
    answer:
      - text: The original target URI, because the redirection might be altered.
        cite: [rfc9110]
  - prompt: What do 307 and 308 add over 302 and 301?
    answer:
      - text: >
          They avoid the historical behaviour in which a user agent may change POST to GET when
          following the redirect.
        cite: [rfc9110]
